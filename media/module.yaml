apply: [ //jvm.module-template.yaml, //publishing.module-template.yaml ]

product: jvm/lib

description: A set of image processing tools for LightningServer.

dependencies:
  - //files: exported
  - //media-shared: exported
  - com.sksamuel.scrimage:scrimage-core:4.5.1: exported
  - com.sksamuel.scrimage:scrimage-webp:4.5.1: exported
  - com.sksamuel.scrimage:scrimage-formats-extra:4.5.1: exported

test-dependencies:
  - org.jetbrains.kotlin:kotlin-test:2.4.10
  - org.jetbrains.kotlin:kotlin-test-junit:2.4.10

settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:media" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, media_test ]

apply: [ //jvm.module-template.yaml, //publishing.module-template.yaml ]

product: jvm/lib

description: AWS EC2 deployment with Auto Scaling and Load Balancing for Lightning Server.

settings:
  kotlin:
    serialization: enabled
    ksp:
      processors:
        - com.lightningkite.services:database-processor:1.3.0-prerelease-113-79195cb8
      processorOptions:
        generateFields: "true"

# NOTE: Gradle excluded software.amazon.awssdk:netty-nio-client and :apache-client from
# every AWS dependency below. The Kotlin Toolchain has no exclude mechanism. See the
# migration report; this module constructs no sync AWS client of its own.
dependencies:
  - //core: exported
  - //engine-local: exported
  - com.lightningkite.services:aws-client:1.3.0-prerelease-113-79195cb8: exported
  - software.amazon.awssdk:s3:2.42.34: exported
  - software.amazon.awssdk:secretsmanager:2.42.34: exported
  - software.amazon.awssdk:sqs:2.40.3: exported
  - org.jetbrains.kotlinx:kotlinx-coroutines-reactive:1.11.0
  - org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.11.0
  - org.jetbrains.kotlin:kotlin-reflect:2.4.10: exported

test-dependencies:
  - org.jetbrains.kotlin:kotlin-test:2.4.10
  - org.jetbrains.kotlin:kotlin-test-junit:2.4.10

settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:deploy-aws-ec2" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, deploy-aws-ec2_test ]

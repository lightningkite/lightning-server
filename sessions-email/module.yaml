apply: [ //jvm.module-template.yaml, //publishing.module-template.yaml ]

product: jvm/lib

description: A set of tools and endpoints for user authentication using email.

settings:
  kotlin:
    serialization: enabled

dependencies:
  - //sessions: exported
  - com.lightningkite.services:email:1.3.0-prerelease-113-79195cb8: exported

test-dependencies:
  - org.jetbrains.kotlin:kotlin-test:2.4.10
  - org.jetbrains.kotlin:kotlin-test-junit:2.4.10
  - com.lightningkite.services:cache:1.3.0-prerelease-113-79195cb8

settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:sessions-email" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, sessions-email_test ]

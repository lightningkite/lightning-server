apply: [ //jvm.module-template.yaml, //publishing.module-template.yaml ]

product: jvm/lib

description: The core components that make up a Lightning Server framework.

settings:
  kotlin:
    serialization: enabled

dependencies:
  - org.jetbrains.kotlinx:kotlinx-io-core:0.9.0: exported
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0: exported
  - org.jetbrains.kotlinx:kotlinx-serialization-json-io:1.11.0: exported
  - org.jetbrains.kotlinx:kotlinx-serialization-properties:1.11.0: exported
  - com.lightningkite.services:data:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:basis:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:kotlin-bytes-format:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:otel-jvm:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:webhook-subservice:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:pubsub:1.3.0-prerelease-113-79195cb8: exported
  - org.jetbrains.kotlinx:kotlinx-html-jvm:0.12.0: exported
  - //core-shared: exported
  # Multiplatform cryptography libraries
  - dev.whyoleg.cryptography:cryptography-core:0.6.0: exported
  - dev.whyoleg.cryptography:cryptography-provider-optimal:0.6.0: exported

test-dependencies:
  - org.jetbrains.kotlin:kotlin-test:2.4.10
  - org.jetbrains.kotlin:kotlin-test-junit:2.4.10
  - io.opentelemetry:opentelemetry-sdk-testing:1.60.1

# Gradle names the Kotlin module "<group>:<artifact>", which determines the
# META-INF/*.kotlin_module entry. The Toolchain defaults to the module directory name.
settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:core" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, core_test ]

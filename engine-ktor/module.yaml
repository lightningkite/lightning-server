apply: [ //jvm.module-template.yaml, //publishing.module-template.yaml ]

product: jvm/lib

description: A Ktor engine implementation for Lightning Server.

settings:
  kotlin:
    serialization: enabled

dependencies:
  - //core: exported
  - //engine-local: exported
  - com.lightningkite.services:database:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:cache:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:pubsub:1.3.0-prerelease-113-79195cb8: exported
  - org.jetbrains.kotlin:kotlin-reflect:2.4.10: exported
  # Ktor dependencies
  - io.ktor:ktor-server-core-jvm:3.3.3: exported
  - io.ktor:ktor-server-netty-jvm:3.3.3: exported
  - io.ktor:ktor-server-cio-jvm:3.3.3: exported
  - io.ktor:ktor-server-websockets-jvm:3.3.3: exported
  - io.ktor:ktor-server-call-logging:3.3.3: exported
  - io.ktor:ktor-serialization-kotlinx-json:3.3.3: exported

test-dependencies:
  - org.jetbrains.kotlin:kotlin-test:2.4.10
  - org.jetbrains.kotlin:kotlin-test-junit:2.4.10
  - //engine-conformance
  - io.ktor:ktor-server-test-host-jvm:3.3.3
  - io.ktor:ktor-client-cio-jvm:3.3.3
  - io.ktor:ktor-client-websockets-jvm:3.3.3
  - io.opentelemetry:opentelemetry-sdk-testing:1.60.1

# Gradle names the Kotlin module "<group>:<artifact>", which determines the
# META-INF/*.kotlin_module entry. The Toolchain defaults to the module directory name.
settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:engine-ktor" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, engine-ktor_test ]

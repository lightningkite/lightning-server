site_name: Lightning Server
site_description: Kotlin server framework — typed endpoints, swappable services, and derived AWS infrastructure.
site_url: https://lightningkite.github.io/lightning-server/
repo_url: https://github.com/lightningkite/lightning-server
repo_name: lightningkite/lightning-server

# All guide chapters live in docs-guide/guide/; index.md acts as the Home page.
docs_dir: docs-guide/guide

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
    - Overview: overview.md
    - Condensed guide: condensed-guide.md
    - Setup: setup.md
    - Your first endpoint: first-endpoint.md
    - Project structure: project-structure.md
    - Running: running.md
  - Building APIs:
    - Routing: routing.md
    - Typed endpoints: typed-endpoints.md
    - Error handling: error-handling.md
    - Validation: validation.md
    - Serialization: serialization.md
    - WebSockets: websockets.md
    - Bulk requests and funnels: bulk-endpoints.md
    - Client SDKs: client-sdks.md
    - CORS and interceptors: cors-interceptors.md
    - Rate limiting: rate-limiting.md
    - Meta endpoints and admin: meta-admin.md
  - Data:
    - Services: services.md
    - Settings: settings.md
    - Database: database.md
    - Advanced database: advanced-database.md
    - Model REST endpoints: model-rest.md
    - Permissions: permissions.md
    - Realtime model updates: model-realtime.md
    - Caching: caching.md
    - Pub/Sub: pubsub.md
    - Files: files.md
    - Media: media.md
  - Users and messaging:
    - Authentication: auth.md
    - Proof-based login: proof-session.md
    - OAuth: oauth.md
    - Encryption: encryption.md
    - Email and SMS: email.md
    - Notifications: notifications.md
  - Background work:
    - Tasks: tasks.md
    - Schedules: schedules.md
  - Operations:
    - Testing: testing.md
    - Observability: observability.md
    - Engines: engines.md
    - Deploying to AWS Lambda: aws-deployment.md
    - Deploying to EC2: deploy-ec2.md
    - Deploying to a VM: deploy-vm.md
    - Terraform: terraform.md
  - Reference:
    - Architecture: architecture.md
    # Dokka output is uploaded per module by `lk docs` (metawork); this is core's.
    - API reference (Dokka): https://lightningkite-maven.s3.us-west-2.amazonaws.com/com/lightningkite/lightningserver/core/docs/
  - Appendix:
    - Coming from Django: appendix/vs-django.md
    - Coming from Rails: appendix/vs-rails.md
    - Coming from Spring: appendix/vs-spring.md
    - Migrating v4 to v5: appendix/migration-v4-to-v5.md
    - Migrating v5.1 to v5.2: appendix/migration-v5.1-to-v5.2.md
    - Migrating to epoch 1: appendix/migration-to-epoch-1.md

apply: [ //jvm.module-template.yaml, //publishing.module-template.yaml ]

product: jvm/lib

description: A set of tools and endpoints for handling user notifications.

settings:
  kotlin:
    serialization: enabled
    freeCompilerArgs: [ -Xnested-type-aliases ]
    ksp:
      processors:
        - com.lightningkite.services:database-processor:1.3.0-prerelease-113-79195cb8
      processorOptions:
        generateFields: "true"

dependencies:
  - //core: exported
  - //auth: exported
  - //typed: exported
  - //notifications-shared: exported
  - com.lightningkite.services:database:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:email:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:notifications-fcm:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:sms:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:cache:1.3.0-prerelease-113-79195cb8: exported
  - org.jetbrains.kotlin:kotlin-reflect:2.4.10: exported
  - dev.turingcomplete:kotlin-onetimepassword:2.4.1
  - org.bouncycastle:bcprov-jdk18on:1.84
  - org.bouncycastle:bcpkix-jdk18on:1.84
  - com.webauthn4j:webauthn4j-core:0.31.3.RELEASE

test-dependencies:
  - org.jetbrains.kotlin:kotlin-test:2.4.10
  - org.jetbrains.kotlin:kotlin-test-junit:2.4.10

settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:notifications" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, notifications_test ]

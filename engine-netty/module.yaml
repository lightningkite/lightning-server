apply: [ //jvm.module-template.yaml, //publishing.module-template.yaml ]

product: jvm/lib

description: A Netty engine implementation for Lightning Server.

settings:
  kotlin:
    serialization: enabled

dependencies:
  - //core: exported
  - //engine-local: exported
  - com.lightningkite.services:database:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:cache:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:pubsub:1.3.0-prerelease-113-79195cb8: exported
  - org.jetbrains.kotlin:kotlin-reflect:2.4.10: exported

  # Gradle used platform(libs.netty.bom); the Toolchain imports a BOM natively, and
  # the catalog entries below carry no version so the BOM supplies it.
  - bom: io.netty:netty-bom:4.1.114.Final
  - $libs.netty.codec.http
  - $libs.netty.handler
  - $libs.netty.transport
  - $libs.netty.buffer
  - $libs.netty.codec
  # For native transports (compile-time APIs); actual native libs load if present on the platform
  - $libs.netty.transport.classes.epoll
  - $libs.netty.transport.classes.kqueue

test-dependencies:
  - org.jetbrains.kotlin:kotlin-test:2.4.10
  - org.jetbrains.kotlin:kotlin-test-junit:2.4.10
  - //engine-conformance
  - com.squareup.okhttp3:okhttp:5.3.2
  - io.opentelemetry:opentelemetry-sdk-testing:1.60.1

# Gradle names the Kotlin module "<group>:<artifact>", which determines the
# META-INF/*.kotlin_module entry. The Toolchain defaults to the module directory name.
settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:engine-netty" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, engine-netty_test ]

apply: [ //jvm.module-template.yaml, //publishing.module-template.yaml ]

product: jvm/lib

description: A set of endpoints and tools for managing PublicFileSystems.

settings:
  kotlin:
    serialization: enabled

dependencies:
  - //typed: exported
  - //files-shared: exported
  - com.lightningkite.services:database:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:files:1.3.0-prerelease-113-79195cb8: exported
  - org.jetbrains.kotlin:kotlin-reflect:2.4.10: exported

test-dependencies:
  - org.jetbrains.kotlin:kotlin-test:2.4.10
  - org.jetbrains.kotlin:kotlin-test-junit:2.4.10

settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:files" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, files_test ]

apply: [ //jvm.module-template.yaml, //publishing.module-template.yaml ]

product: jvm/lib

description: An engine implementation and deployment tools for deploying a Lightning Server project in AWS Lambda.

settings:
  kotlin:
    serialization: enabled

# NOTE: Gradle excluded software.amazon.awssdk:netty-nio-client and :apache-client from
# every AWS dependency below. The Kotlin Toolchain has no exclude mechanism, so both remain
# on the classpath and the AWS SDK cannot pick a sync HTTP implementation on its own. See the
# migration report: AwsAdapter.kt:99 and :109 need an explicit .httpClient(...).
dependencies:
  - //core: exported
  - com.lightningkite.services:aws-client:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:cache-dynamodb:1.3.0-prerelease-113-79195cb8: exported
  - software.amazon.awssdk:s3:2.42.34: exported
  - software.amazon.awssdk:lambda:2.42.34: exported
  - software.amazon.awssdk:apigatewaymanagementapi:2.42.34: exported
  - software.amazon.awssdk:secretsmanager:2.42.34: exported
  - com.amazonaws:aws-lambda-java-core:1.4.0: exported
  - com.amazonaws:aws-lambda-java-events:3.16.1: exported
  - software.amazon.awssdk:dynamodb:2.42.34: exported
  - io.github.crac:org-crac:0.1.3: exported
  - org.jetbrains.kotlinx:kotlinx-coroutines-reactive:1.11.0
  - org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.11.0
  - org.jetbrains.kotlin:kotlin-reflect:2.4.10: exported

test-dependencies:
  - org.jetbrains.kotlin:kotlin-test:2.4.10
  - org.jetbrains.kotlin:kotlin-test-junit:2.4.10

settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:engine-aws-serverless" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, engine-aws-serverless_test ]

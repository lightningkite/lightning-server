apply: [ //jvm.module-template.yaml, //publishing.module-template.yaml ]

product: jvm/lib

description: A set of tools for typing, documenting, and requiring authentication in endpoints.

settings:
  kotlin:
    serialization: enabled
    ksp:
      processors:
        - com.lightningkite.services:database-processor:1.3.0-prerelease-113-79195cb8
      processorOptions:
        generateFields: "true"

dependencies:
  - //core: exported
  - //auth: exported
  - //typed-shared: exported
  - com.lightningkite.services:database:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:cache:1.3.0-prerelease-113-79195cb8: exported
  - com.lightningkite.services:http-client:1.3.0-prerelease-113-79195cb8: exported
  - org.jetbrains.kotlin:kotlin-reflect:2.4.10: exported

test-dependencies:
  - org.jetbrains.kotlin:kotlin-test-junit:2.4.10
  - io.opentelemetry:opentelemetry-sdk-testing:1.60.1

# The test source set declares its own models, and Gradle ran the processor over test
# sources separately (kspTest) rather than reusing the main ksp configuration's output.
test-settings:
  kotlin:
    ksp:
      processors:
        - com.lightningkite.services:database-processor:1.3.0-prerelease-113-79195cb8
      processorOptions:
        generateFields: "true"

settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.lightningserver:typed" ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, typed_test ]

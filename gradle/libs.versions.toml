aws-s3 = { module = "software.amazon.awssdk:s3", version = { ref = "awsVersion" } }
aws-secrets-manager = { module = "software.amazon.awssdk:secretsmanager", version = { ref = "awsVersion" } }
aws-signin = { module = "software.amazon.awssdk:signin", version.ref = "awsVersion" }
commons-codec = { module = "commons-codec:commons-codec", version = { ref = "commonsCodec" } }
coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version = { ref = "coroutines" } }
dynamodb = { module = "software.amazon.awssdk:dynamodb", version = { ref = "awsVersion" } }
kotlin-html-jvm = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version = { ref = "kotlinHtmlJvm" } }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version = { ref = "kotlin" } }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version = { ref = "kotlin" } }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version = { ref = "kotlin" } }
kotlinerCli = { module = "com.lightningkite:kotliner-cli", version = { ref = "kotlinerCli" } }
kotlinx-crypto-core = { module = "dev.whyoleg.cryptography:cryptography-core", version = { ref = "cryptographyKotlin" } }
kotlinx-crypto-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version = { ref = "cryptographyKotlin" } }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = { ref = "kotlinXDatetime" } }
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version = { ref = "kotlinXIO" } }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = { ref = "kotlinXSerialization" } }

[versions]
agp = "9.1.1"
androidDesugaring = "2.1.5"
awsVersion = "2.55.5"
commonsCodec = "1.21.0"
coroutines = "1.11.0"
cryptographyKotlin = "0.6.0"
dependencyCheck = "13.0.0"
detekt = "1.23.8"
dokka = "2.3.0"
graalVmNative = "1.1.14"
kotlin = "2.4.21"
kotlinHtmlJvm = "0.12.0"
kotlinXDatetime = "0.8.0"
kotlinXIO = "0.9.2"
kotlinXSerialization = "1.12.0"
kotlinerCli = "1.0.5"
kover = "0.9.11"
ksp = "2.3.13"

netty-transport = { module = "io.netty:netty-transport", version = "0.0.0" }
netty-transport-classes-epoll = { module = "io.netty:netty-transport-classes-epoll", version = "0.0.0" }
netty-transport-classes-kqueue = { module = "io.netty:netty-transport-classes-kqueue", version = "0.0.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
openTelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "openTelemetry" }
oneTimePass = { module = "dev.turingcomplete:kotlin-onetimepassword", version = { ref = "oneTimePass" } }
orgCrac = { module = "io.github.crac:org-crac", version = { ref = "orgCrac" } }
proguard = { module = "com.guardsquare:proguard-gradle", version = { ref = "proguard" } }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version = "5.6.4" }
scrimage = { module = "com.sksamuel.scrimage:scrimage-core", version = { ref = "scrimage" } }
scrimage-formats = { module = "com.sksamuel.scrimage:scrimage-formats-extra", version = { ref = "scrimage" } }
scrimage-webP = { module = "com.sksamuel.scrimage:scrimage-webp", version = { ref = "scrimage" } }
serialization-properties = { module = "org.jetbrains.kotlinx:kotlinx-serialization-properties", version = { ref = "kotlinXSerialization" } }
webauthn4j-core = { module = "com.webauthn4j:webauthn4j-core", version = { ref = "webauthn4jCore" } }

[plugins]
androidApp = { id = "com.android.application", version = { ref = "agp" } }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version = { ref = "agp" } }
# OWASP dependency-check: known-CVE scanner. Report-only (see root build.gradle.kts).
dependencyCheck = { id = "org.owasp.dependencycheck", version = { ref = "dependencyCheck" } }
detekt = { id = "io.gitlab.arturbosch.detekt", version = { ref = "detekt" } }
dokka = { id = "org.jetbrains.dokka", version = { ref = "dokka" } }
graalVmNative = { id = "org.graalvm.buildtools.native", version = { ref = "graalVmNative" } }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = { ref = "kotlin" } }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version = { ref = "kotlin" } }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = { ref = "kotlin" } }
kover = { id = "org.jetbrains.kotlinx.kover", version = { ref = "kover" } }
ksp = { id = "com.google.devtools.ksp", version = { ref = "ksp" } }
vanniktechMavenPublish = { id = "com.vanniktech.maven.publish", version = { ref = "vanniktechMavenPublish" } }
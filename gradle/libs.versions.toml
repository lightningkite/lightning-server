ktor-client-websockets-jvm = { module = "io.ktor:ktor-client-websockets-jvm", version = { ref = "ktor" } }
ktor-websockets = { module = "io.ktor:ktor-server-websockets-jvm", version = { ref = "ktor" } }
lambda-java-core = { module = "com.amazonaws:aws-lambda-java-core", version = { ref = "lambdaJavaCore" } }
lambda-java-events = { module = "com.amazonaws:aws-lambda-java-events", version = { ref = "lambdaJavaEvents" } }
netty-bom = { module = "io.netty:netty-bom", version = { ref = "netty" } }
